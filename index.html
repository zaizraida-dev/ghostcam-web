<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GhostCam Web</title>
    <!-- Pengaturan agar bisa jadi PWA di iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Elemen Kamera Web -->
        <video id="video" autoplay playsinline muted></video>
        
        <!-- Gambar Overlay Transparan -->
        <img id="overlay-image" class="overlay hidden" alt="Overlay">

        <!-- UI Kontrol di Atas Kamera -->
        <div class="overlay-ui">
            <button id="opacity-btn" class="opacity-btn hidden">Transparansi: 50%</button>
            
            <div class="controls">
                <button id="pick-btn" class="btn-small">Pilih Foto</button>
                <input type="file" id="file-input" accept="image/*" class="hidden">
                
                <button id="capture-btn" class="capture-btn">
                    <div class="capture-btn-inner"></div>
                </button>
                
                <button id="clear-btn" class="btn-small">Hapus Foto</button>
            </div>
        </div>
    </div>

    <!-- Canvas tersembunyi untuk memproses hasil jepretan foto -->
    <canvas id="canvas" class="hidden"></canvas>

    <script src="app.js"></script>
</body>
</html>
